name: EXP-0007 Reproducibility

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly
  push:
    branches: [main]

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reproducibility subset
        run: |
          pytest tests/test_reproducibility.py -v
          python scripts/run_r14.py --lightweight

      - name: Verify data integrity
        run: |
          python -c "
          import json, os
          files = [
              'research_continuation/r14_summary.json',
              'research_continuation/CONTINUATION_FINAL.json',
              'research_continuation/FINAL_MANIFEST.json',
          ]
          for f in files:
              assert os.path.exists(f), f'Missing: {f}'
              with open(f) as fh:
                  data = json.load(fh)
              assert 'project' in data or 'R14' in data, f'Invalid: {f}'
          print('All data files verified')
          "
