name: EXP-0007 Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install flake8 black

      - name: Check formatting
        run: black --check scripts/ tests/ || true

      - name: Check style
        run: flake8 scripts/ tests/ --max-line-length=120
